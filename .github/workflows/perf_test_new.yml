name: HDA Performance Test (new, one-off)

on:
  workflow_dispatch:
  schedule:
    # One-off: Mon 2026-07-13 06:00 Europe/Vienna (CEST, UTC+2) = 04:00 UTC.
    # NOTE: cron has no "year" field, so day+month pins this to July 13 every
    # year, not just 2026 — delete this schedule entry after the run if you
    # don't want it firing again next July.
    - cron: "0 4 13 7 *"

jobs:
  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests opentelemetry-sdk opentelemetry-exporter-otlp-proto-http locust shapely reportlab matplotlib

      - name: Configure environment
        run: |
          echo "PYTHONPATH=$GITHUB_WORKSPACE/scripts"                          >> $GITHUB_ENV
          echo "HDA_URL=https://dev.hda.eodchosting.eu"                        >> $GITHUB_ENV
          echo "VU_MAX=300"                                                    >> $GITHUB_ENV
          echo "OTEL_ENDPOINT=https://otel.infra.eodc.eu/v1/metrics"           >> $GITHUB_ENV
          echo "OTEL_API_KEY=${{ secrets.OTEL_API_KEY }}"                      >> $GITHUB_ENV

      - name: Run performance test
        run: python scripts/perf_test.py

      # if: always() below — the ramp is expected to possibly run to the timeout
      # without breaking; without this, a killed "Run performance test" step would
      # skip report + upload entirely and the incrementally-written stage data
      # would never leave the runner.
      - name: Generate report
        if: always()
        run: |
          if [ -f perf_results.json ]; then
            python scripts/report_generator.py perf_results.json report.pdf
          else
            echo "No perf_results.json — test was killed before completing a single stage."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hda-perf-report
          path: |
            perf_results.json
            report.pdf
          if-no-files-found: warn
          retention-days: 90
