name: HDA Performance Test (MTU comparison)

# Manual only. One run gives an overview per HDA delivery path:
#   1. net_diag before: prod + dev, every delivery path (scripts/hda_targets.py),
#      DNS/TCP/TLS/TTFB/total, TCP mss/pmtu/retransmits, tracepath, DF pings
#   2. mixed ramp on dev (TASK_MODE=e2e, 5->130 VUs) — comparable to July 2026
#   3. per-path ramp on dev (TASK_MODE=paths, 5->55 VUs), timed to the last byte
#   4. net_diag after: dev again, to see if it recovered
#   5. step summary with all tables + artifact with all raw JSON
# ~25 min, load only on dev, prod only gets the light sequential diagnostics.
on:
  workflow_dispatch:
    inputs:
      vu_max:
        description: "mixed ramp: max VUs (July baseline went up to 800)"
        default: "130"
      paths_vu_max:
        description: "per-path ramp: max VUs"
        default: "55"
      label:
        description: "label for the artifact, e.g. after_mtu"
        default: "after_mtu"

jobs:
  performance:
    name: Performance
    runs-on: ubuntu-latest
    timeout-minutes: 75
    env:
      PYTHONPATH: ${{ github.workspace }}/scripts
      HDA_URL: https://dev.hda.eodchosting.eu
      VU_STEP: "25"
      SPAWN_RATE: "25"
      OTEL_ENDPOINT: https://otel.observability.eodc.eu/v1/metrics
      OTEL_API_KEY: ${{ secrets.OTEL_API_KEY }}
      OUT: out
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: |
          pip install requests opentelemetry-sdk opentelemetry-exporter-otlp-proto-http locust
          sudo apt-get install -y -qq iputils-tracepath >/dev/null || true
          mkdir -p $OUT

      - name: Diagnostics before load (prod + dev)
        continue-on-error: true
        run: |
          python scripts/net_diag.py 1_before https://data.eodc.eu $OUT/net_diag_1_before_prod.json
          python scripts/net_diag.py 1_before https://dev.hda.eodchosting.eu $OUT/net_diag_1_before_dev.json

      - name: TCP counters before
        run: nstat -az | grep -E '^(TcpOutSegs|TcpRetransSegs|TcpInSegs|TcpInErrs|TcpExtTCPTimeouts|TcpExtTCPLostRetransmit|TcpExtTCPSlowStartRetrans|TcpExtTCPFastRetrans)\s' > $OUT/nstat_before.txt || true

      - name: Mixed ramp on dev (comparable to July)
        continue-on-error: true
        env:
          VU_MAX: ${{ inputs.vu_max }}
          RESULTS_JSON: out/perf_results_e2e.json
        run: python scripts/perf_test.py

      - name: Per-path ramp on dev
        continue-on-error: true
        env:
          TASK_MODE: paths
          VU_MAX: ${{ inputs.paths_vu_max }}
          RESULTS_JSON: out/perf_results_paths.json
        run: python scripts/perf_test.py

      - name: TCP counters after
        if: always()
        run: nstat -az | grep -E '^(TcpOutSegs|TcpRetransSegs|TcpInSegs|TcpInErrs|TcpExtTCPTimeouts|TcpExtTCPLostRetransmit|TcpExtTCPSlowStartRetrans|TcpExtTCPFastRetrans)\s' > $OUT/nstat_after.txt || true

      - name: Diagnostics after load (dev)
        if: always()
        continue-on-error: true
        run: python scripts/net_diag.py 2_after https://dev.hda.eodchosting.eu $OUT/net_diag_2_after_dev.json

      - name: Summary
        if: always()
        run: python scripts/make_summary.py $OUT | tee $OUT/summary.md >> $GITHUB_STEP_SUMMARY

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hda-perf-${{ inputs.label }}-${{ github.run_id }}
          path: out/
          if-no-files-found: warn
          retention-days: 90
