name: HDA Ingestion + Download Concurrency Test

on:
  workflow_dispatch:

jobs:
  ingestion:
    name: Ingestion download concurrency
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install requests reportlab matplotlib

      - name: Configure environment
        run: |
          echo "HDA_URL=https://dev.hda.eodchosting.eu"      >> $GITHUB_ENV
          echo "CONCURRENCY_LEVELS=1,3,5,10,15,20"            >> $GITHUB_ENV
          echo "ACCEPTABLE_INGEST_WAIT_SECS=180"              >> $GITHUB_ENV
          echo "MAX_INGEST_WAIT_SECS=300"                     >> $GITHUB_ENV
          echo "POLL_INTERVAL_SECS=15"                        >> $GITHUB_ENV
          echo "DOWNLOAD_TIMEOUT_SECS=300"                    >> $GITHUB_ENV
          echo "DOWNLOAD_DIR=${{ runner.temp }}/hda_ingestion_test" >> $GITHUB_ENV

      # deletes every downloaded file immediately after verifying its size
      # (see ingestion_download_test.py) — safe on the runner's disk even at
      # the higher concurrency levels, since only the CURRENTLY in-flight
      # downloads exist on disk at once, not every attempt cumulatively.
      - name: Run ingestion + download concurrency test
        run: python scripts/ingestion_download_test.py

      # if: always() — same reasoning as perf_test_new.yml: the script writes
      # ingestion_results.json after every concurrency level, so even a run
      # killed by the job timeout should still produce a partial report.
      - name: Generate report
        if: always()
        run: |
          if [ -f ingestion_results.json ]; then
            python scripts/ingestion_report_generator.py ingestion_results.json ingestion_report.pdf
          else
            echo "No ingestion_results.json — test was killed before completing a single level."
          fi

      - name: Upload results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: hda-ingestion-results
          path: |
            ingestion_results.json
            ingestion_report.pdf
          if-no-files-found: warn
          retention-days: 90
